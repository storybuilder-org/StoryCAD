# Publishes a StoryCADLib prerelease package from dev to nuget.org, so consumers
# such as StoryCADMcp (StoryCADAPI) can build against dev between releases
# (Collaborator#291, #1648). The package carries CollaboratorLib.dll, as the
# release package does. Version: <major>.<minor>.0-dev.<run>, which NuGet shows
# only to callers who ask for prereleases. No GitHub release, no store step.
#
# Manual only. nuget.org can unlist a version but never delete it.
name: NuGet prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Base version, major.minor (e.g. 4.4)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prerelease:
    if: github.ref == 'refs/heads/dev'
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: "./global.json"
          cache: true

      - name: Package version
        id: version
        shell: pwsh
        env:
          BASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:BASE_VERSION -notmatch '^\d+\.\d+$') { throw "version must be major.minor, e.g. 4.4" }
          $v = "$($env:BASE_VERSION).0-dev.${{ github.run_number }}"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $v"

      # Restore as Release, as build-release.yml does (UNOB0019 with a Debug restore).
      - name: Restore
        run: dotnet restore StoryCAD.sln -p:Configuration=Release

      - name: Build CollaboratorLib for the package
        shell: pwsh
        run: dotnet build CollaboratorLib/CollaboratorLib.csproj -c Release --no-restore

      - name: Pack StoryCADLib NuGet
        shell: pwsh
        run: dotnet pack StoryCADLib/StoryCADLib.csproj -c Release -p:IsPackable=true -p:PackageVersion=${{ steps.version.outputs.version }} -o "${{ github.workspace }}\nupkg"

      - name: Verify NuGet contains both TFMs and CollaboratorLib
        shell: pwsh
        run: ./scripts/Verify-StoryCADLibPackage.ps1 -PackageDir "${{ github.workspace }}\nupkg"

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "${{ github.workspace }}\nupkg\StoryCADLib.*.nupkg" --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
