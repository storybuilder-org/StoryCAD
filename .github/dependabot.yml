version: 2

# Every ecosystem lands in one weekly PR. Security updates still open on their own, straight away.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"

updates:
  # Package versions live in Directory.Packages.props at the root, so one entry covers every project.
  - package-ecosystem: "nuget"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "dotnet-sdk"   # global.json
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "bundler"      # manual site (Jekyll)
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "pip"          # Python bindings
    directory: "/StoryCADLib/bindings/python"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "docker"       # test database image
    directory: "/StoryCADTests/TestDb"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"
