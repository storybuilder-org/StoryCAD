version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"                 # Directory.Packages.props covers every project
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "dotnet-sdk"   # global.json
    directory: "/"
    schedule: { interval: "weekly" }

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "bundler"      # manual site (Jekyll)
    directory: "/"
    schedule: { interval: "monthly" }

  - package-ecosystem: "pip"          # Python bindings
    directory: "/StoryCADLib/bindings/python"
    schedule: { interval: "monthly" }

  - package-ecosystem: "docker"       # test database image
    directory: "/StoryCADTests/TestDb"
    schedule: { interval: "monthly" }
